name: Inspect public bounty scope
on:
  push:
    branches: ['bounty/progsbase-correctness-20260921']
    paths: ['.github/workflows/bounty-scope.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Retrieve native template export and programme snapshot
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,urllib.request,urllib.parse
          out=pathlib.Path('sources'); out.mkdir()
          url='https://repo.progsbase.com/repoviewer/no.inductive.libraries/TextualTemplates/0.1.22/?'+urllib.parse.urlencode({'view':'bundle','accept':'text/plain;subtype=text/x-c;subtypeversion=99'})
          with urllib.request.urlopen(url,timeout=30) as r: raw=r.read(3000001)
          if len(raw)>3000000: raise ValueError('size limit')
          (out/'TextualTemplates-0.1.22.c').write_bytes(raw)
          manifest={'file':'TextualTemplates-0.1.22.c','url':url,'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)}
          print(json.dumps(manifest));(out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          request=urllib.request.Request('https://certs.progsbase.com',data=json.dumps({'command':'GetBugbountyOverview'}).encode(),headers={'Content-Type':'application/json'})
          with urllib.request.urlopen(request,timeout=20) as r: overview=r.read()
          (out/'bounty-overview.json').write_bytes(overview)
          print('ACTIVE_TARGET',[r for r in json.loads(overview)['rows'] if r['function']=='GenerateDocument'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-template-source
          path: sources/
          retention-days: 7
