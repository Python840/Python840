name: Inspect public bounty scope
on:
  push:
    branches: ['bounty/progsbase-correctness-20260921']
    paths: ['.github/workflows/bounty-scope.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify public programme status and contact
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime,json,re,urllib.request
          def fetch(url,payload=None):
              req=urllib.request.Request(url,data=None if payload is None else json.dumps(payload).encode(),headers={'Content-Type':'application/json','User-Agent':'Python840-correctness-research/1.0'})
              with urllib.request.urlopen(req,timeout=20) as response: return response.read(1000000).decode()
          print('CHECKED_UTC',datetime.datetime.now(datetime.timezone.utc).isoformat())
          overview=json.loads(fetch('https://certs.progsbase.com',{'command':'GetBugbountyOverview'}))
          row=next(row for row in overview['rows'] if row['function']=='GenerateDocument')
          print('TARGET',json.dumps(row))
          page=fetch('https://www.progsbase.com/bug-bounty/')
          addresses=set(re.findall(r'mailto:([^\"\s<>]+)',page))
          for encoded in re.findall(r'data-cfemail=[\"\x27]([0-9a-fA-F]+)',page):
              data=bytes.fromhex(encoded);addresses.add(bytes(value^data[0] for value in data[1:]).decode())
          print('PUBLISHED_EMAILS',json.dumps(sorted(addresses)))
          PY
