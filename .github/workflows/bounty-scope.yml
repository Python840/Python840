name: Inspect public bounty scope
on:
  push:
    branches: ['bounty/progsbase-correctness-20260921']
    paths: ['.github/workflows/bounty-scope.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Retrieve exact public template source and documentation
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,urllib.request,urllib.parse
          out=pathlib.Path('sources'); out.mkdir()
          manifest=[]
          def save(url,name):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Python840-correctness-research/1.0'}),timeout=30) as r: raw=r.read(3000001)
              if len(raw)>3000000: raise ValueError('size limit')
              (out/name).write_bytes(raw)
              row={'file':name,'url':url,'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)};manifest.append(row);print(json.dumps(row))
          root='https://repo.progsbase.com/repoviewer/no.inductive.libraries/TextualTemplates/0.1.22/'
          for ext,mime in [('py','text/plain;subtype=text/x-python;subtypeversion=2'),('java','text/plain;subtype=text/x-java;subtypeversion=5')]:
              save(root+'?'+urllib.parse.urlencode({'view':'bundle','accept':mime}),'TextualTemplates-0.1.22.'+ext)
          for ns,lib,v in [('no.inductive.libraries','TextualTemplates','0.1.22'),('no.inductive.libraries','LoadBalancer','0.1.4'),('no.inductive.idea10.programs','datetime','0.1.19')]:
              save('https://repo.progsbase.com/repoviewer/'+ns+'/'+lib+'/'+v+'/',lib+'-docs.html')
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: template-and-docs
          path: sources/
          retention-days: 7
