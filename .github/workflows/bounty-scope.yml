name: Inspect public bounty scope
on:
  push:
    branches: ['bounty/progsbase-correctness-20260921']
    paths: ['.github/workflows/bounty-scope.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read published bounty records
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, urllib.request
          def query(payload):
              req=urllib.request.Request('https://certs.progsbase.com', data=json.dumps(payload).encode(), headers={'Content-Type':'application/json','User-Agent':'Python840-correctness-research/1.0'})
              with urllib.request.urlopen(req,timeout=20) as response:
                  raw=response.read(2000001)
              if len(raw)>2000000: raise ValueError('response too large')
              print('RESPONSE_SHA256',hashlib.sha256(raw).hexdigest())
              return json.loads(raw)
          overview=query({'command':'GetBugbountyOverview'})
          print('OVERVIEW_KEYS',list(overview))
          rows=overview.get('rows',[])
          for row in rows: print('BOUNTY_ROW',json.dumps(row,ensure_ascii=True))
          selected=[r for r in rows if 50<=float(r.get('amount',0))<=150 and not r.get('underreview',False)]
          for row in selected[:12]:
              print('DESCRIPTION_FOR',row.get('function'),row.get('lib'),row.get('version'))
              print(json.dumps(query({'command':'GetBugbountyDescription','namespace':row['orgnamespace'],'version':row['version'],'library':row['lib'],'function':row['function']}),ensure_ascii=True))
          with urllib.request.urlopen('https://repo.progsbase.com/common/languages.js',timeout=20) as response:
              print('LANGUAGE_EXPORT_FORMATS',response.read(30000).decode())
          PY
